name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build and test run as separate jobs, in parallel: tests.sh compiles the
# production sources into its own test binary, so it does not use build.sh's
# output and waiting for one before the other would only add their times.
jobs:
  build:
    name: build (macOS)
    # macos-latest is macOS 15 / Xcode 16 — its SDK predates NSGlassEffectView
    # (macOS 26), which the build references behind a runtime #available guard.
    # Compilation still needs the symbol, so the image must carry the 26 SDK.
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pick the newest installed Xcode so the SDK can't trail the image.
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcode-select -p
          swift --version

      - name: Build
        run: ./build.sh

  test:
    name: test (macOS)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pick the newest installed Xcode so the SDK can't trail the image.
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcode-select -p
          swift --version

      - name: Test suite
        # tests.sh regenerates Runtime/api.js, runs docs/sync.py --check, then
        # builds and runs the test binary. A test that hangs names itself on
        # stderr after 30s; the job timeout (15 min) catches the hang itself.
        # Refine later with --exclude '<regex>' if specific tests prove flaky here.
        run: ./tests.sh

      - name: Upload test binary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stackd-tests-binary
          path: .build/stackd-tests
          if-no-files-found: ignore
          retention-days: 3
