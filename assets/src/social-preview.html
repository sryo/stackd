<!doctype html>
<!--
  Source for assets/social-preview.png (GitHub social preview + og:image), 1280x640.

  Render at 2x off-screen, then downsample:

    "/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary" \
      --headless=new --hide-scrollbars --window-size=1280,640 \
      --force-device-scale-factor=2 --virtual-time-budget=4000 \
      --screenshot=/tmp/social-preview@2x.png "file://$PWD/assets/src/social-preview.html"
    magick /tmp/social-preview@2x.png -filter Lanczos -resize '1280x640!' -strip assets/social-preview.png

  Inter loads from Google Fonts (same request as the site); a locally installed
  Inter or SF Pro covers the offline case. Optical sizing is off so a local
  variable Inter renders the same text cut the site gets from Google Fonts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>stackd social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111318;
    --text: #f0f0f0;
    --text-2: #a0a0a0;
    --accent: #0a84ff;
    --sans: "Inter", -apple-system, "SF Pro Display", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --safe: 80px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }

  body {
    position: relative;
    font-family: var(--sans);
    font-optical-sizing: none;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 90% at 85% 10%, #0a84ff 0%, transparent 55%),
      radial-gradient(90% 80% at 10% 95%, #5e5ce6 0%, transparent 60%),
      radial-gradient(70% 60% at 60% 70%, #ff375f33 0%, transparent 60%),
      var(--bg);
  }

  /* Negative offsets cancel glyph side bearings so the "s", the "M" and the
     code card share one optical left edge at --safe. top: 56px puts the
     ascender line on --safe, level with the widget's top edge. */
  .brand { position: absolute; left: var(--safe); top: 56px; }
  .brand h1 {
    font-size: 176px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-left: -7px;
  }
  .brand p {
    margin: 8px 0 0 -4px;
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.2;
    color: rgba(240, 240, 240, 0.86);
  }

  .source {
    position: absolute;
    left: var(--safe);
    bottom: var(--safe);
    padding: 24px 34px 30px;
    border-radius: 26px;
    background: rgba(17, 19, 24, 0.84);
    border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.38);
    font-family: var(--mono);
    white-space: nowrap;
  }
  .source .path {
    font-size: 28px;
    line-height: 1.3;
    margin-bottom: 12px;
    color: rgba(240, 240, 240, 0.55);
  }
  .source .code { font-size: 32px; line-height: 1.4; }
  .source .tag { color: var(--text-2); }
  .source .signal {
    color: color-mix(in srgb, var(--accent) 42%, white);
    background: rgba(10, 132, 255, 0.22);
    border-radius: 10px;
    padding: 3px 6px;
    margin: 0 1px;
  }

  .widget {
    position: absolute;
    right: var(--safe);
    top: var(--safe);
    width: 344px;
    padding: 30px 36px 34px;
    border-radius: 46px;
    background: linear-gradient(165deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.12) 45%, rgba(255, 255, 255, 0.08) 100%);
    -webkit-backdrop-filter: blur(28px) saturate(1.7) brightness(1.06);
    backdrop-filter: blur(28px) saturate(1.7) brightness(1.06);
    border: 1px solid rgba(255, 255, 255, 0.40);
    box-shadow:
      0 30px 70px rgba(0, 0, 20, 0.34),
      inset 0 1.5px 0 rgba(255, 255, 255, 0.60),
      inset 0 -1px 0 rgba(255, 255, 255, 0.12);
  }
  .widget .label {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.80);
  }
  .widget .value {
    margin-top: 14px;
    font-size: 120px;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1;
    color: #fff;
  }
  .widget .value .unit {
    font-size: 0.5em;
    font-weight: 600;
    letter-spacing: 0;
    margin-left: 6px;
    color: rgba(255, 255, 255, 0.80);
  }

  /* Tail sits on the code line's vertical centre; head stops short of the
     widget's bottom edge, on its horizontal centre (x = 1028). */
  .flow {
    position: absolute;
    inset: 0;
    width: 1280px;
    height: 640px;
    fill: none;
    stroke: rgba(255, 255, 255, 0.72);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
  <section class="brand">
    <h1>stackd</h1>
    <p>Make your computer feel like yours</p>
  </section>

  <div class="source">
    <div class="path">~/stackd/stacks/battery/index.html</div>
    <div class="code"><span class="tag">&lt;div&gt;</span><span class="signal">{{ sd.battery.percent }}</span>%<span class="tag">&lt;/div&gt;</span></div>
  </div>

  <svg class="flow" viewBox="0 0 1280 640" aria-hidden="true">
    <path d="M 898 507 C 990 507, 1028 448, 1028 350"/>
    <path d="M 1007 374 L 1028 346 L 1049 374"/>
  </svg>

  <div class="widget">
    <div class="label">Battery</div>
    <div class="value">87<span class="unit">%</span></div>
  </div>
</body>
</html>
